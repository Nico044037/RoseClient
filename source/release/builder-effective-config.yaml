directories:
  output: release
  buildResources: build
appId: com.roseclient.launcher
productName: RoseClient
files:
  - filter:
      - src/**/*
      - resources/**/*
      - package.json
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 37.10.3
