<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoseClient Console</title><link rel="stylesheet" href="logs.css"></head>
<body><div class="app-shell"><header><div class="brand"><div class="flower">✿</div><div><div class="eyebrow">ROSECLIENT / LIVE CONSOLE</div><h1>Little log garden</h1><p>Launch events, downloads and Minecraft output in one cozy place.</p></div></div><div class="live"><i></i> LIVE</div></header>
<section class="toolbar"><div class="filters" role="group" aria-label="Filter logs"><button class="filter active" data-level="all">All</button><button class="filter" data-level="info">Info</button><button class="filter" data-level="warn">Warnings</button><button class="filter" data-level="error">Errors</button></div><label class="search">⌕ <input id="search" placeholder="Find a log…" autocomplete="off"></label><label class="autoscroll"><input type="checkbox" id="autoscroll" checked> Follow latest</label></section>
<div class="statusline"><span><b class="status-dot"></b> Listening for RoseClient events</span><span id="count">0 entries</span></div><main id="logs" aria-live="polite"><div class="empty"><span>🌷</span><h2>Waiting for the first petal…</h2><p>Logs will appear here as RoseClient starts up.</p></div></main>
<footer><span>Made with care <b>♥</b> · RoseClient</span><div><button id="open-file" class="soft">Open log file</button><button id="clear" class="soft">Clear view</button></div></footer></div><script src="logs.js"></script></body></html>
